<div class="container">
  <h2>Contact Support</h2>

  <form #formRef="ngForm" (ngSubmit)="submitForm()">

    <label>Name:</label>
    <input type="text"
           [(ngModel)]="name"
           name="name"
           required />

    <label>Email:</label>
    <input type="email"
           [(ngModel)]="email"
           name="email"
           required />

    <label>Message:</label>
    <textarea [(ngModel)]="message"
              name="message"
              rows="4"
              required></textarea>

    <div class="button-group">
      <button type="submit">Send</button>
      <button type="button" (click)="formRef.reset()" class="reset-btn">
        Reset
      </button>
    </div>

  </form>

  <p class="response">{{ responseMessage }}</p>
</div>
