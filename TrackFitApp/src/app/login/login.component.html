<div class="auth-container d-flex justify-content-center align-items-center">
  <div class="auth-card p-4 shadow">

    <h3 class="text-center mb-3">Login</h3>

    <form #loginForm="ngForm" (ngSubmit)="login(loginForm)">

      <!-- Email -->
      <div class="mb-3">
        <label>Email</label>
        <input type="email"
               name="email"
               class="form-control"
               ngModel
               required
               #emailRef="ngModel"
               [class.is-invalid]="emailRef.invalid && (emailRef.dirty || emailRef.touched)"
               [class.is-valid]="emailRef.valid && (emailRef.dirty || emailRef.touched)" />

        <div *ngIf="emailRef.invalid && (emailRef.dirty || emailRef.touched)" class="text-danger small">
          <div *ngIf="emailRef.errors?.['required']">
            Email is required
          </div>
          <div *ngIf="emailRef.errors?.['email']">
            Enter valid email
          </div>
        </div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label>Password</label>
        <input type="password"
               name="password"
               class="form-control"
               ngModel
               required
               #passRef="ngModel"
               [class.is-invalid]="passRef.invalid && (passRef.dirty || passRef.touched)"
               [class.is-valid]="passRef.valid && (passRef.dirty || passRef.touched)" />

        <div *ngIf="passRef.invalid && (passRef.dirty || passRef.touched)" class="text-danger small">
          <div *ngIf="passRef.errors?.['required']">
            Password is required
          </div>
        </div>
      </div>

      <!-- Submit -->
      <button class="btn btn-primary w-100" type="submit">
        Login
      </button>



      <button type="button"
              class="btn btn-secondary w-100"
              (click)="loginForm.reset()">
        Reset
      </button>


  


  <p class="auth-footer">
    Don''t have an account?
    <span routerLink="/register" class="auth-link">Register</span>
  </p>


  </form>

  <!-- Success -->
  <div *ngIf="successMessage" class="text-success text-center mb-2">
    {{ successMessage }}
  </div>

  <!-- Error -->
  <div *ngIf="errorMessage" class="text-success text-center mb-2">
    {{ errorMessage }}
  </div>

</div>
</div>
